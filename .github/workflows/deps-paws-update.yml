name: Paws Collector Dependency Update

# Audits and fixes the root @alertlogic/paws-collector library.
# - No PR is raised unless the fixes actually change files.
# - Draft PR when tests fail or high/critical vulnerabilities remain.
# - Ready PR only when audit is clean and tests pass.

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-deps:
    name: Audit and Update Root Dependencies
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Safe audit fix
        run: npm audit fix --audit-level=low || true

      - name: Update npm overrides for transitive vulnerabilities
        run: node .github/scripts/update-overrides.js

      - name: Sync package-lock.json with updated overrides
        run: npm install --package-lock-only

      - name: Check remaining high/critical
        id: pre_force
        run: |
          count=$(npm audit --json 2>/dev/null | node -e "
            let d={};try{d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'))}catch{};
            const v=d.metadata&&d.metadata.vulnerabilities||{};
            process.stdout.write(String((v.high||0)+(v.critical||0)));
          " 2>/dev/null || echo 0)
          echo "high_critical=$count" >> "$GITHUB_OUTPUT"

      - name: Snapshot pre-force state
        if: steps.pre_force.outputs.high_critical != '0'
        run: |
          cp package.json /tmp/pre_force_package.json
          cp package-lock.json /tmp/pre_force_lock.json

      - name: Force major fix for high/critical
        if: steps.pre_force.outputs.high_critical != '0'
        run: npm audit fix --force --audit-level=high || true

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Revert force-fix if tests broke
        id: revert
        if: steps.pre_force.outputs.high_critical != '0' && steps.tests.outcome == 'failure'
        run: |
          echo "::warning::--force broke root tests — reverting."
          cp /tmp/pre_force_package.json package.json
          cp /tmp/pre_force_lock.json package-lock.json
          echo "reverted=true" >> "$GITHUB_OUTPUT"

      - name: Re-run tests after revert
        id: tests_after_revert
        if: steps.revert.outputs.reverted == 'true'
        continue-on-error: true
        run: npm ci && npm test

      - name: Compute effective tests-passed
        id: tests_final
        run: |
          if [ "${{ steps.revert.outputs.reverted }}" = "true" ]; then
            outcome="${{ steps.tests_after_revert.outcome }}"
          else
            outcome="${{ steps.tests.outcome }}"
          fi
          if [ "$outcome" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version if package.json changed
        id: bump
        run: |
          if ! git diff --quiet package.json 2>/dev/null; then
            node .github/scripts/bump-version.js package.json
          fi

      - name: Verify fix (gate PR opening)
        id: verify
        run: node .github/scripts/verify-fix.js --cwd . --tests-passed ${{ steps.tests_final.outputs.passed }}

      - name: Capture audit summary
        id: audit
        if: steps.verify.outputs.should_open_pr == 'true'
        run: node .github/scripts/audit-summary.js

      - name: Commit and push
        if: steps.verify.outputs.should_open_pr == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -B fix/paws-deps-update
          git add -A
          git commit -m "fix(deps): update @alertlogic/paws-collector dependencies" || true
          git push origin fix/paws-deps-update --force-with-lease

      - name: Create or update pull request
        if: steps.verify.outputs.should_open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP_CHANGES_TABLE: ${{ steps.audit.outputs.dep_changes_table }}
          VULN_TABLE: ${{ steps.audit.outputs.vuln_table }}
          VULN_COUNT: ${{ steps.audit.outputs.vuln_count }}
          NEW_VERSION: ${{ steps.audit.outputs.new_version }}
          PR_STATE: ${{ steps.verify.outputs.pr_state }}
          RESIDUAL_HIGH: ${{ steps.verify.outputs.residual_high }}
          RESIDUAL_CRITICAL: ${{ steps.verify.outputs.residual_critical }}
          RESIDUAL_ADVISORIES: ${{ steps.verify.outputs.residual_advisories }}
          TESTS_PASSED: ${{ steps.tests_final.outputs.passed }}
          REVERTED: ${{ steps.revert.outputs.reverted }}
          SUMMARY: ${{ steps.verify.outputs.summary_md }}
        run: |
          gh label create "deps-paws-lib" --color "0075ca" \
            --description "Dependency updates for paws-collector root library" --force
          gh label create "tests-failing" --color "b60205" \
            --description "PR has failing tests — do not merge" --force
          gh label create "partial-fix" --color "fbca04" \
            --description "Some high/critical vulnerabilities remain unresolved" --force

          extra_notes=""
          if [ "$REVERTED" = "true" ]; then
            extra_notes="${extra_notes}
          > **Note:** \`npm audit fix --force\` broke tests and was reverted."
          fi
          if [ "$TESTS_PASSED" != "true" ]; then
            extra_notes="${extra_notes}
          > **Warning:** Tests are failing — diagnose before merging."
          fi
          if [ "$RESIDUAL_HIGH" != "0" ] || [ "$RESIDUAL_CRITICAL" != "0" ]; then
            extra_notes="${extra_notes}
          > **Residual advisories:** \`${RESIDUAL_ADVISORIES}\`"
          fi

          title="fix(deps): update @alertlogic/paws-collector dependencies"
          body="## Dependency Update — @alertlogic/paws-collector

          ${SUMMARY}

          | | |
          |---|---|
          | Tests | **$( [ \"$TESTS_PASSED\" = \"true\" ] && echo passed || echo failed )** |
          | High vulns remaining | **${RESIDUAL_HIGH}** |
          | Critical vulns remaining | **${RESIDUAL_CRITICAL}** |
          | New version | \`${NEW_VERSION}\` |
          ${extra_notes}

          ### Dependency changes
          ${DEP_CHANGES_TABLE}

          ### Vulnerabilities addressed (${VULN_COUNT} found in this run)
          ${VULN_TABLE}

          ### Next step
          After this PR is reviewed and merged, [collector-paws-pin](.github/workflows/collector-paws-pin.yml)
          will pin the new version across every collector.

          ### Workflow run
          [View log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          ---
          *Opened automatically by [deps-paws-update](.github/workflows/deps-paws-update.yml). Review and merge when ready — no auto-merge.*"

          labels="deps-paws-lib"
          if [ "$TESTS_PASSED" != "true" ]; then labels="${labels},tests-failing"; fi
          if [ "$RESIDUAL_HIGH" != "0" ] || [ "$RESIDUAL_CRITICAL" != "0" ]; then labels="${labels},partial-fix"; fi

          if gh pr view fix/paws-deps-update --json number > /dev/null 2>&1; then
            gh pr edit fix/paws-deps-update --title "$title" --body "$body"
            if [ "$PR_STATE" = "draft" ]; then
              gh pr ready fix/paws-deps-update --undo || true
            else
              gh pr ready fix/paws-deps-update || true
            fi
          else
            draft_flag=""
            if [ "$PR_STATE" = "draft" ]; then draft_flag="--draft"; fi
            gh pr create $draft_flag \
              --title "$title" \
              --body "$body" \
              --base master \
              --head fix/paws-deps-update \
              --label "$labels"
          fi

      - name: Report no PR
        if: steps.verify.outputs.should_open_pr != 'true'
        run: echo "::notice::No dependency changes to raise — skipping PR."
