name: Paws Collector Dependency Update

on:
  push:
    branches: [master]
  schedule:
    # Twice weekly: Monday and Thursday at 09:00 UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Audit and Update Root Dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix (safe fixes only)
        # --force is intentionally excluded to avoid breaking changes
        run: npm audit fix || true

      - name: Update npm overrides for transitive vulnerabilities
        run: node .github/scripts/update-overrides.js

      - name: Detect changes
        id: detect
        run: |
          if git diff --name-only | grep -qE 'package(-lock)?\.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version in root package.json
        if: steps.detect.outputs.changed == 'true'
        run: node .github/scripts/bump-version.js package.json

      - name: Commit and push changes
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -B fix/paws-deps-update
          git add -A
          git commit -m "fix(deps): update @alertlogic/paws-collector dependencies" || true
          git push origin fix/paws-deps-update --force

      - name: Create or update pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## Dependency Update — @alertlogic/paws-collector

          This PR was raised automatically after \`npm audit fix\` and
          \`update-overrides.js\` detected outdated or vulnerable packages
          in the root \`@alertlogic/paws-collector\` library.

          ### What was changed
          - Direct dependency versions bumped by \`npm audit fix\`
          - \`overrides\` section updated for transitive vulnerabilities
          - Patch version incremented in root \`package.json\`

          ### Next step
          After this PR is reviewed and **merged to master**, the
          [collector-deps-sync](.github/workflows/collector-deps-sync.yml)
          workflow will automatically raise a second PR to sync all collector
          \`package.json\` files to the new \`@alertlogic/paws-collector\` version.

          ---
          *Opened automatically by [deps-paws-update](.github/workflows/deps-paws-update.yml). Review and merge when ready — no auto-merge.*"

          gh pr create \
            --title "fix(deps): update @alertlogic/paws-collector dependencies" \
            --body "$BODY" \
            --base master \
            --head fix/paws-deps-update \
            --label deps-paws-lib \
          || gh pr edit fix/paws-deps-update \
            --title "fix(deps): update @alertlogic/paws-collector dependencies" \
            --body "$BODY"
