name: Collector Dependency Sync

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  detect-root-bump:
    name: Detect Root Version Bump
    permissions:
      contents: read
    runs-on: ubuntu-latest

    outputs:
      should_sync: ${{ steps.detect.outputs.should_sync }}
      paws_version: ${{ steps.detect.outputs.paws_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Check if root package.json version was bumped
        id: detect
        run: |
          # On workflow_dispatch, always sync
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PAWS_VERSION=$(node -p "require('./package.json').version")
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "paws_version=$PAWS_VERSION" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: will sync collectors to paws-collector@$PAWS_VERSION"
            exit 0
          fi

          # On push, only sync if the version field changed in this commit
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "none")
          CURR=$(node -p "require('./package.json').version")

          echo "Previous root version: $PREV"
          echo "Current root version:  $CURR"

          if [ "$PREV" != "$CURR" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "paws_version=$CURR" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "paws_version=$CURR" >> "$GITHUB_OUTPUT"
            echo "Root version unchanged — skipping collector sync."
          fi

  sync-collectors:
    name: Sync All Collectors
    needs: detect-root-bump
    if: needs.detect-root-bump.outputs.should_sync == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Sync each collector
        id: sync
        env:
          PAWS_VERSION: ${{ needs.detect-root-bump.outputs.paws_version }}
        run: |
          AUDIT_ROWS=""
          HAS_REMAINING_VULNS=false
          HAS_TEST_FAILURES=false

          for dir in collectors/*/; do
            name=$(basename "$dir")
            if [ "$name" = "template" ]; then continue; fi
            pkg="${dir}package.json"
            if [ ! -f "$pkg" ]; then continue; fi

            echo "========== Processing $name =========="

            # 1. Pin @alertlogic/paws-collector version
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('$pkg', 'utf8'));
              const key = '@alertlogic/paws-collector';
              if (p.dependencies && p.dependencies[key]) {
                const prev = p.dependencies[key];
                p.dependencies[key] = process.env.PAWS_VERSION;
                console.log(key + ': ' + prev + ' -> ' + process.env.PAWS_VERSION);
                fs.writeFileSync('$pkg', JSON.stringify(p, null, 2) + '\n', 'utf8');
              } else {
                console.log(key + ' not found in dependencies — skipping version pin');
              }
            "

            # 2. Install (collectors have no package-lock.json by design —
            #    collector.mk uses npm install and its clean target deletes the lock file)
            (cd "$dir" && npm install) || true

            # 3. Safe audit fix — minor/patch direct deps
            (cd "$dir" && npm audit fix) || true

            # 4. Transitive vulnerability overrides
            node .github/scripts/update-overrides.js --cwd "$dir"

            # 5. Force-fix any remaining vulns with major version bumps.
            #    Unlike root (where Dependabot handles majors), collectors have no
            #    Dependabot coverage so we must apply major fixes here.
            #    Changes are never reverted — tests below validate whether safe.
            (cd "$dir" && npm audit fix --force) || true

            # 6. Sync package-lock.json after all fixes
            (cd "$dir" && npm install --package-lock-only) || true

            # 7. Count remaining vulnerabilities after all fixes
            VULN_COUNT=0
            VULN_COUNT=$(cd "$dir" && npm audit --json 2>/dev/null | node -e "
              try {
                const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
                process.stdout.write(String(d.metadata?.vulnerabilities?.total || 0));
              } catch { process.stdout.write('0'); }
            " 2>/dev/null) || VULN_COUNT=0

            if [ "$VULN_COUNT" = "0" ]; then
              VULN_STATUS="**0 (clean)**"
            else
              VULN_STATUS="**$VULN_COUNT remaining**"
              HAS_REMAINING_VULNS=true
            fi

            # 8. Run tests — capture result, never abort the loop
            TEST_STATUS="**passed**"
            if ! (cd "$dir" && npm test > /tmp/test_${name}.txt 2>&1); then
              TEST_STATUS="**failed**"
              HAS_TEST_FAILURES=true
              echo "--- Test failure output for $name ---"
              tail -30 /tmp/test_${name}.txt
            fi

            # 9. Bump patch version only if files actually changed
            if ! git diff --quiet "$pkg" 2>/dev/null || \
               ! git diff --quiet "${dir}package-lock.json" 2>/dev/null; then
              node .github/scripts/bump-version.js "$pkg"
            fi

            AUDIT_ROWS="${AUDIT_ROWS}| \`${name}\` | ${VULN_STATUS} | ${TEST_STATUS} |"$'\n'
          done

          # Write multiline outputs safely using heredoc delimiters
          {
            echo "audit_rows<<GHADELIM_AUDIT"
            printf '%s' "$AUDIT_ROWS"
            echo "GHADELIM_AUDIT"
            echo "has_remaining_vulns=$HAS_REMAINING_VULNS"
            echo "has_test_failures=$HAS_TEST_FAILURES"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -B fix/collector-deps-sync
          git add -A
          git commit -m "fix(deps): sync all collector dependencies after paws-collector@${{ needs.detect-root-bump.outputs.paws_version }}" || true
          git push origin fix/collector-deps-sync --force

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_ROWS: ${{ steps.sync.outputs.audit_rows }}
          HAS_REMAINING_VULNS: ${{ steps.sync.outputs.has_remaining_vulns }}
          HAS_TEST_FAILURES: ${{ steps.sync.outputs.has_test_failures }}
          PAWS_VERSION: ${{ needs.detect-root-bump.outputs.paws_version }}
        run: |
          gh label create "deps-collectors" \
            --color "e4e669" \
            --description "Dependency sync for individual collector packages" \
            --force

          # Build status notice based on outcome
          if [ "$HAS_TEST_FAILURES" = "true" ] && [ "$HAS_REMAINING_VULNS" = "true" ]; then
            STATUS_NOTICE="> **Failed — some tests failed and vulnerabilities remain.** Review the table below and the [workflow log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) before merging."
          elif [ "$HAS_TEST_FAILURES" = "true" ]; then
            STATUS_NOTICE="> **Failed — some tests failed after dependency fixes.** The fixes are included in this PR — check the [workflow log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for failure details."
          elif [ "$HAS_REMAINING_VULNS" = "true" ]; then
            STATUS_NOTICE="> **Warning — some vulnerabilities could not be auto-fixed** (likely need a manual breaking-change upgrade). See table below."
          else
            STATUS_NOTICE="> **All collectors: 0 vulnerabilities and tests passing.**"
          fi

          TITLE="fix(deps): sync all collector dependencies after paws-collector@$PAWS_VERSION"
          BODY="## Collector Dependency Sync

          Syncs all collectors after root \`@alertlogic/paws-collector\` was updated to **v${PAWS_VERSION}**.

          $STATUS_NOTICE

          ### Per-collector status

          | Collector | Vulnerabilities | Tests |
          |---|---|---|
          $AUDIT_ROWS
          > **Vulnerabilities**: counts remaining after safe fix + overrides + forced major fix.
          > **Tests**: run immediately after all fixes — failure means the forced major bump broke something.
          > Check the [workflow run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for full test output per collector.

          ### What was applied per collector
          1. \`@alertlogic/paws-collector\` pinned to \`$PAWS_VERSION\`
          2. \`npm audit fix\` — safe minor/patch fixes
          3. \`update-overrides.js\` — transitive vulnerability overrides
          4. \`npm audit fix --force\` — major version fixes for remaining vulns
          5. Tests run to validate — results shown above

          ---
          *Opened automatically by [collector-deps-sync](.github/workflows/collector-deps-sync.yml). Review and merge when ready — no auto-merge.*"

          if gh pr view fix/collector-deps-sync --json number > /dev/null 2>&1; then
            gh pr edit fix/collector-deps-sync --title "$TITLE" --body "$BODY"
          else
            gh pr create \
              --title "$TITLE" \
              --body "$BODY" \
              --base master \
              --head fix/collector-deps-sync \
              --label "deps-collectors"
          fi
