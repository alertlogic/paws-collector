name: Collector Dependency Audit

# Per-collector dependency audit and auto-fix.
# Runs on a schedule so collector-specific vulnerabilities are caught between
# root paws-collector releases. Opens one PR per collector — only when the
# fixes actually reduce vulnerabilities. Draft when tests fail or when
# high/critical vulnerabilities remain unresolved.

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      collector:
        description: 'Single collector to audit (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  discover:
    name: Discover Collectors
    runs-on: ubuntu-latest
    outputs:
      collectors: ${{ steps.list.outputs.collectors }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build collector matrix
        id: list
        env:
          FILTER: ${{ github.event.inputs.collector }}
        run: |
          # Build a JSON array of collector directory names, skipping 'template'.
          names=$(find collectors -mindepth 1 -maxdepth 1 -type d \
            -not -name template \
            -printf '%f\n' | sort)

          if [ -n "$FILTER" ]; then
            names=$(echo "$names" | grep -Fx "$FILTER" || true)
          fi

          if [ -z "$names" ]; then
            echo "collectors=[]" >> "$GITHUB_OUTPUT"
            echo "No collectors selected."
            exit 0
          fi

          json=$(echo "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "collectors=$json" >> "$GITHUB_OUTPUT"
          echo "Selected collectors: $json"

  audit:
    name: Audit ${{ matrix.collector }}
    needs: discover
    if: needs.discover.outputs.collectors != '[]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        collector: ${{ fromJson(needs.discover.outputs.collectors) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install collector dependencies
        working-directory: collectors/${{ matrix.collector }}
        run: npm install --no-audit --no-fund

      - name: Safe audit fix (minor/patch)
        working-directory: collectors/${{ matrix.collector }}
        run: npm audit fix --audit-level=low || true

      - name: Update transitive-vuln overrides
        run: node .github/scripts/update-overrides.js --cwd collectors/${{ matrix.collector }}

      - name: Re-install after overrides
        working-directory: collectors/${{ matrix.collector }}
        run: npm install --no-audit --no-fund

      - name: Check remaining high/critical
        id: pre_force
        working-directory: collectors/${{ matrix.collector }}
        run: |
          count=$(npm audit --json 2>/dev/null | node -e "
            let d={};try{d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'))}catch{};
            const v=d.metadata&&d.metadata.vulnerabilities||{};
            process.stdout.write(String((v.high||0)+(v.critical||0)));
          " 2>/dev/null || echo 0)
          echo "high_critical=$count" >> "$GITHUB_OUTPUT"
          echo "High/critical remaining after safe fixes: $count"

      # Only force major bumps when HIGH/CRITICAL still remain — never for
      # moderate/low. If --force breaks tests, we revert it below and let a
      # human triage the residual.
      - name: Snapshot pre-force state
        if: steps.pre_force.outputs.high_critical != '0'
        working-directory: collectors/${{ matrix.collector }}
        run: |
          cp package.json /tmp/pre_force_package.json
          if [ -f package-lock.json ]; then cp package-lock.json /tmp/pre_force_lock.json; fi

      - name: Force major fix for high/critical
        if: steps.pre_force.outputs.high_critical != '0'
        working-directory: collectors/${{ matrix.collector }}
        run: npm audit fix --force --audit-level=high || true

      # Collectors intentionally have no committed package-lock.json
      # (collector.mk clean removes it). Delete before staging so the audit
      # never leaks a lock file into the PR.
      - name: Remove ephemeral lock file
        working-directory: collectors/${{ matrix.collector }}
        run: rm -f package-lock.json

      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: collectors/${{ matrix.collector }}
        run: npm test

      - name: Revert force-fix if tests broke
        id: revert
        if: steps.pre_force.outputs.high_critical != '0' && steps.tests.outcome == 'failure'
        working-directory: collectors/${{ matrix.collector }}
        run: |
          echo "::warning::--force broke tests for ${{ matrix.collector }} — reverting."
          cp /tmp/pre_force_package.json package.json
          echo "reverted=true" >> "$GITHUB_OUTPUT"

      - name: Re-run tests after revert
        id: tests_after_revert
        if: steps.revert.outputs.reverted == 'true'
        continue-on-error: true
        working-directory: collectors/${{ matrix.collector }}
        run: npm install --no-audit --no-fund && npm test

      - name: Compute effective tests-passed
        id: tests_final
        run: |
          if [ "${{ steps.revert.outputs.reverted }}" = "true" ]; then
            outcome="${{ steps.tests_after_revert.outcome }}"
          else
            outcome="${{ steps.tests.outcome }}"
          fi
          if [ "$outcome" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version if files changed
        working-directory: collectors/${{ matrix.collector }}
        run: |
          if ! git diff --quiet package.json 2>/dev/null; then
            cd "$GITHUB_WORKSPACE"
            node .github/scripts/bump-version.js collectors/${{ matrix.collector }}/package.json
          fi

      - name: Verify fix (gate PR opening)
        id: verify
        run: node .github/scripts/verify-fix.js --cwd collectors/${{ matrix.collector }} --tests-passed ${{ steps.tests_final.outputs.passed }}

      - name: Audit summary for PR body
        id: audit_summary
        if: steps.verify.outputs.should_open_pr == 'true'
        run: node .github/scripts/audit-summary.js --cwd collectors/${{ matrix.collector }}

      - name: Commit and push
        if: steps.verify.outputs.should_open_pr == 'true'
        env:
          COLLECTOR: ${{ matrix.collector }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          branch="fix/deps-collector-${COLLECTOR}"
          git checkout -B "$branch"
          # Stage only the collector's package.json — no lock file
          git add "collectors/${COLLECTOR}/package.json"
          git commit -m "fix(deps/${COLLECTOR}): update dependencies" || true
          git push origin "$branch" --force-with-lease

      - name: Create or update pull request
        if: steps.verify.outputs.should_open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECTOR: ${{ matrix.collector }}
          PR_STATE: ${{ steps.verify.outputs.pr_state }}
          RESIDUAL_HIGH: ${{ steps.verify.outputs.residual_high }}
          RESIDUAL_CRITICAL: ${{ steps.verify.outputs.residual_critical }}
          RESIDUAL_ADVISORIES: ${{ steps.verify.outputs.residual_advisories }}
          TESTS_PASSED: ${{ steps.tests_final.outputs.passed }}
          REVERTED: ${{ steps.revert.outputs.reverted }}
          SUMMARY: ${{ steps.verify.outputs.summary_md }}
          DEP_CHANGES_TABLE: ${{ steps.audit_summary.outputs.dep_changes_table }}
          VULN_TABLE: ${{ steps.audit_summary.outputs.vuln_table }}
          NEW_VERSION: ${{ steps.audit_summary.outputs.new_version }}
        run: |
          gh label create "deps-collectors" --color "e4e669" \
            --description "Dependency updates for individual collectors" --force
          gh label create "tests-failing" --color "b60205" \
            --description "PR has failing tests — do not merge" --force
          gh label create "partial-fix" --color "fbca04" \
            --description "Some high/critical vulnerabilities remain unresolved" --force

          branch="fix/deps-collector-${COLLECTOR}"
          title="fix(deps/${COLLECTOR}): update dependencies to v${NEW_VERSION}"

          extra_notes=""
          if [ "$REVERTED" = "true" ]; then
            extra_notes="${extra_notes}
          > **Note:** \`npm audit fix --force\` broke tests and was reverted. Residual
          > high/critical vulnerabilities need a manual breaking-change upgrade."
          fi
          if [ "$TESTS_PASSED" != "true" ]; then
            extra_notes="${extra_notes}
          > **Warning:** Tests are failing on this branch. Diagnose before merging."
          fi
          if [ "$RESIDUAL_HIGH" != "0" ] || [ "$RESIDUAL_CRITICAL" != "0" ]; then
            extra_notes="${extra_notes}
          > **Residual advisories** (top 20): \`${RESIDUAL_ADVISORIES}\`"
          fi

          body="## Collector Dependency Update — \`${COLLECTOR}\`

          ${SUMMARY}

          | | |
          |---|---|
          | Tests | **$( [ \"$TESTS_PASSED\" = \"true\" ] && echo passed || echo failed )** |
          | High vulns remaining | **${RESIDUAL_HIGH}** |
          | Critical vulns remaining | **${RESIDUAL_CRITICAL}** |
          | New version | \`${NEW_VERSION}\` |
          ${extra_notes}

          ### Dependency changes
          ${DEP_CHANGES_TABLE}

          ### Vulnerabilities addressed
          ${VULN_TABLE}

          ### Workflow run
          [View log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          ---
          *Opened automatically by [collector-deps-audit](.github/workflows/collector-deps-audit.yml). Review and merge when ready — no auto-merge.*"

          labels="deps-collectors"
          if [ "$TESTS_PASSED" != "true" ]; then labels="${labels},tests-failing"; fi
          if [ "$RESIDUAL_HIGH" != "0" ] || [ "$RESIDUAL_CRITICAL" != "0" ]; then labels="${labels},partial-fix"; fi

          if gh pr view "$branch" --json number > /dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body "$body"
            # Toggle draft state to match current run
            if [ "$PR_STATE" = "draft" ]; then
              gh pr ready "$branch" --undo || true
            else
              gh pr ready "$branch" || true
            fi
          else
            draft_flag=""
            if [ "$PR_STATE" = "draft" ]; then draft_flag="--draft"; fi
            gh pr create $draft_flag \
              --title "$title" \
              --body "$body" \
              --base master \
              --head "$branch" \
              --label "$labels"
          fi
