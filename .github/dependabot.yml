version: 2
updates:
  # Root paws-collector — version bumps (minor+major) in one PR, security in another
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - deps-paws-lib
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions — all updates grouped into one PR
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - deps-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-updates:
        patterns:
          - "*"
