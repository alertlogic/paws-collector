version: 2
updates:
  # Root paws-collector npm dependencies — Monday
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - deps-paws-lib
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Root paws-collector npm dependencies — Thursday
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: thursday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - deps-paws-lib
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - deps-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
